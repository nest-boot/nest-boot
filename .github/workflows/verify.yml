name: Verify

on:
  workflow_call:
    inputs:
      fetch-depth:
        type: number
        default: 1
      release:
        type: boolean
        default: false
      release-projects:
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  consumer:
    name: Packed consumer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24.21.0", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages --skip-nx-cache
      - name: Verify independent consumer
        run: pnpm test:consumer

  verify:
    name: Verify
    needs: consumer
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      rustfs:
        image: rustfs/rustfs:1.0.0-rc.4
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: rustfs
          RUSTFS_SECRET_KEY: secretsecret
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ENABLE: "false"
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release policy
        run: |
          node --test .github/scripts/release-*.test.mjs
          node .github/scripts/release-policy.mjs "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"

      - name: Commitlint latest commit
        if: inputs.release
        run: pnpm commitlint --last --verbose

      - name: Build packages
        run: pnpm build:packages --skip-nx-cache

      - name: Build examples
        run: pnpm build:examples --skip-nx-cache

      - name: Typecheck Auth source and tests
        run: pnpm --filter @nest-boot/auth typecheck

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Storage e2e suites create their buckets through the AWS SDK.
      - name: Test
        run: pnpm test:cov
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_BUCKET: test-bucket
          STORAGE_FORCE_PATH_STYLE: true
          STORAGE_ACCESS_KEY_ID: rustfs
          STORAGE_SECRET_ACCESS_KEY: secretsecret

      - name: End-to-end test
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_BUCKET: test-bucket
          STORAGE_FORCE_PATH_STYLE: true
          STORAGE_ROOT_PATH: tmp/tenant
          STORAGE_ACCESS_KEY_ID: rustfs
          STORAGE_SECRET_ACCESS_KEY: secretsecret

      - name: Verify example SQL driver and native RLS integration
        run: |
          pnpm --filter @nest-boot/example-server exec tsc --noEmit -p tsconfig.json
          pnpm --filter @nest-boot/example-server test
          pnpm --filter @nest-boot/example-server exec vitest run --config vitest.config.e2e.ts test/connection-manager.e2e-spec.ts test/native-rls-migrations.e2e-spec.ts test/job-history.e2e-spec.ts test/job-graphql.e2e-spec.ts

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Configure Git
        if: inputs.release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release packages
        if: inputs.release
        run: node .github/scripts/release-packages.mjs "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: true
          RELEASE_PROJECTS: ${{ inputs.release-projects }}
