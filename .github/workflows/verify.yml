name: Verify

on:
  workflow_call:
    inputs:
      fetch-depth:
        type: number
        default: 1
      release:
        type: boolean
        default: false
      release-projects:
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      mailpit:
        image: axllent/mailpit:v1.31.4
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:8025/livez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 31025:1025
          - 38025:8025

      rustfs:
        image: rustfs/rustfs:1.0.0-rc.4
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: rustfs
          RUSTFS_SECRET_KEY: secretsecret
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ENABLE: "false"
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release policy
        run: |
          node --test .github/scripts/release-*.test.mjs
          node .github/scripts/release-policy.mjs "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"

      - name: Commitlint latest commit
        if: inputs.release
        run: pnpm commitlint --last --verbose

      - name: Build packages
        run: pnpm build:packages --skip-nx-cache

      - name: Build examples
        run: pnpm build:examples --skip-nx-cache

      - name: Typecheck Auth source and tests
        run: pnpm --filter @nest-boot/auth typecheck

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Storage e2e suites create their buckets through the AWS SDK.
      - name: Test
        run: pnpm test:cov
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_BUCKET: test-bucket
          STORAGE_FORCE_PATH_STYLE: true
          STORAGE_ACCESS_KEY_ID: rustfs
          STORAGE_SECRET_ACCESS_KEY: secretsecret

      - name: End-to-end test
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_BUCKET: test-bucket
          STORAGE_FORCE_PATH_STYLE: true
          STORAGE_ROOT_PATH: tmp/tenant
          STORAGE_ACCESS_KEY_ID: rustfs
          STORAGE_SECRET_ACCESS_KEY: secretsecret

      - name: Verify full example server integration
        run: |
          pnpm --filter @nest-boot/example-server exec tsc --noEmit -p tsconfig.json
          pnpm --filter @nest-boot/example-server test
          pnpm --filter @nest-boot/example-server test:e2e
        env:
          SERVER_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          SERVER_E2E_REDIS_URL: redis://localhost:6379
          SERVER_E2E_MAILPIT_URL: http://127.0.0.1:38025
          SERVER_E2E_SMTP_URL: smtp://127.0.0.1:31025

      - name: Install Chromium for Playwright
        run: pnpm --filter @nest-boot/example-client exec playwright install --with-deps chromium

      - name: Verify browser flows
        id: browser-e2e
        run: pnpm --filter @nest-boot/example-client test:e2e
        env:
          SERVER_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          SERVER_E2E_REDIS_URL: redis://localhost:6379
          SERVER_E2E_SMTP_URL: smtp://127.0.0.1:31025
          CLIENT_E2E_MAILPIT_URL: http://127.0.0.1:38025

      - name: Upload failed browser test evidence
        if: ${{ !cancelled() && steps.browser-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: |
            examples/client/playwright-report/
            examples/client/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Configure Git
        if: inputs.release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release packages
        if: inputs.release
        run: node .github/scripts/release-packages.mjs "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: true
          RELEASE_PROJECTS: ${{ inputs.release-projects }}
