name: Verify

on:
  workflow_call:
    inputs:
      fetch-depth:
        type: number
        default: 1
      release:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      minio:
        image: bitnamilegacy/minio
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: password
        options: >-
          --name=minio
          --health-cmd "curl http://localhost:9000/minio/health/live"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Commitlint latest commit
        if: inputs.release
        run: pnpm commitlint --last --verbose

      - name: Build packages
        run: pnpm build:packages --skip-nx-cache

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: TypeDoc
        run: pnpm typedoc:check

      - name: Prepare MinIO bucket
        run: |
          wget -O "$RUNNER_TEMP/mc" https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x "$RUNNER_TEMP/mc"
          "$RUNNER_TEMP/mc" alias set minio http://localhost:9000 minio password
          "$RUNNER_TEMP/mc" mb minio/test-bucket

      - name: Test
        run: pnpm test:cov
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_BUCKET: test-bucket
          STORAGE_FORCE_PATH_STYLE: true
          STORAGE_ACCESS_KEY_ID: minio
          STORAGE_SECRET_ACCESS_KEY: password

      - name: End-to-end test
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_BUCKET: test-bucket
          STORAGE_FORCE_PATH_STYLE: true
          STORAGE_ROOT_PATH: tmp/tenant
          STORAGE_ACCESS_KEY_ID: minio
          STORAGE_SECRET_ACCESS_KEY: password

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Configure Git
        if: inputs.release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release packages
        if: inputs.release
        run: |
          release_args=(--skip-publish)
          release_specifier=()
          npm_tag="latest"

          release_projects="$(
            node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const releaseBase = execFileSync(
            'git',
            ['log', '-1', '--format=%H', '--grep=^chore(release): publish$'],
            { encoding: 'utf8' },
          ).trim();

          if (!releaseBase) {
            throw new Error('Unable to find the previous release commit');
          }

          const changedFiles = execFileSync(
            'git',
            ['diff', '--name-only', `${releaseBase}...HEAD`, '--', 'packages'],
            { encoding: 'utf8' },
          )
            .trim()
            .split('\n')
            .filter(Boolean);
          const projectRoots = new Set(
            changedFiles.map((file) => file.split('/').slice(0, 2).join('/')),
          );
          const projects = [];

          for (const projectRoot of projectRoots) {
            const manifestPath = join(projectRoot, 'package.json');
            if (!existsSync(manifestPath)) continue;

            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
            if (manifest.private || !manifest.name || !manifest.version) continue;

            projects.push(manifest.name);
          }

          process.stdout.write(projects.sort().join(','));
          NODE
          )"

          if [ -z "$release_projects" ]; then
            echo "No changed packages to release"
            exit 0
          fi

          release_args+=(--projects "$release_projects")

          if [ "${GITHUB_REF_NAME}" = "beta" ]; then
            release_args+=(--preid beta)
            npm_tag="beta"

            # The previous beta.0 packages remain immutable on npm after their
            # stale Git tags and GitHub Releases have been removed. Bootstrap
            # the clean beta line at beta.1, then let Nx calculate later betas.
            if ! git show-ref --verify --quiet "refs/tags/@nest-boot/auth@8.0.0-beta.1"; then
              if ! published_beta_version="$(npm view @nest-boot/auth@8.0.0-beta.0 version)"; then
                echo "::error::Unable to verify the published beta.0 bootstrap version"
                exit 1
              fi

              if [ "$published_beta_version" != "8.0.0-beta.0" ]; then
                echo "::error::Unexpected beta.0 bootstrap version: $published_beta_version"
                exit 1
              fi

              release_specifier=(8.0.0-beta.1)
            fi
          fi

          pnpm exec nx release "${release_specifier[@]}" "${release_args[@]}"

          missing_projects="$(
            node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const projects = [];

          for (const entry of readdirSync('packages', { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;

            const manifestPath = join('packages', entry.name, 'package.json');
            if (!existsSync(manifestPath)) continue;

            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
            if (manifest.private || !manifest.name || !manifest.version) continue;

            try {
              execFileSync('npm', ['view', `${manifest.name}@${manifest.version}`, 'version'], {
                stdio: 'ignore',
              });
            } catch {
              projects.push(manifest.name);
            }
          }

          process.stdout.write(projects.join(','));
          NODE
          )"

          if [ -n "$missing_projects" ]; then
            pnpm exec nx release publish --projects "$missing_projects" --yes --tag "$npm_tag"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: true
