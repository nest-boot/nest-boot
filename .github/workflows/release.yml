name: Release

on:
  workflow_dispatch:
    inputs:
      projects:
        description: "Optional comma-separated packages to version; leave empty to recover unpublished versions"
        type: string
        default: ""
  push:
    branches:
      - main
      - beta

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify:
    name: Verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: write
      id-token: write
    with:
      fetch-depth: 0
      release: true
      release-projects: ${{ inputs.projects || '' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
