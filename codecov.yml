codecov:
  notify:
    after_n_builds: 6
    wait_for_ci: true

coverage:
  status:
    project:
      default: false
      packages:
        target: auto
        threshold: 1%
        paths:
          - "packages/"
      examples:
        target: auto
        threshold: 1%
        paths:
          - "examples/"
    patch:
      default: false
      packages:
        target: 95%
        threshold: 0%
        paths:
          - "packages/"
      examples:
        target: auto
        informational: true
        paths:
          - "examples/"

flags:
  packages:
    paths:
      - "packages/"
    carryforward: true
  examples:
    paths:
      - "examples/"
    carryforward: true

component_management:
  individual_components:
    - component_id: packages
      name: Packages
      paths:
        - "packages/**"
      statuses:
        - type: project
          target: auto
          informational: true
    - component_id: examples
      name: Examples
      paths:
        - "examples/**"
      statuses:
        - type: project
          target: auto
          informational: true

ignore:
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/test/**"
  - "**/e2e/**"
  - "examples/client/src/components/ui/**"
  - "examples/client/src/components/thread-ui/**"
  - "examples/client/src/gql/**"
  - "examples/client/src/routeTree.gen.ts"
